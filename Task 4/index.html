<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 id="page-title">Student Grades</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>Amirlan</td>
            <td>HTML</td>
            <td>70</td>
        </tr>
        <tr class="highlight-row">
            <td>Nurtas</td>
            <td>CSS</td>
            <td>86</td>
        </tr>
        <tr>
            <td>Nurislam</td>
            <td>JavaScript</td>
            <td>65</td>
        </tr>
        <tr>
            <td>Amirlan</td>
            <td colspan="2">Web Development - Good Result</td>
        </tr>
    </table>

    <h1 id="form-title">Feedback Form</h1>

    <form class="feedback-form">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">

        <label for="role">Role:</label>
        <select id="role" name="role">
            <option>Student</option>
            <option>Teacher</option>
            <option>Other</option>
        </select>

        <label>Do you like this webpage?</label>

        <div class="radio-group">
            <input type="radio" id="yes" name="answer" value="yes">
            <label for="yes">Yes</label>

            <input type="radio" id="no" name="answer" value="no">
            <label for="no">No</label>
        </div>

        <label for="comments">Comments:</label>
        <textarea id="comments" name="comments" rows="5" placeholder="Write your comments"></textarea>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
